version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: civicresolve-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: civicresolve
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  app:
    build: .
    container_name: civicresolve-app
    restart: always
    environment:
      DATABASE_URL: "postgresql://postgres:password@postgres:5432/civicresolve?schema=public"
      PORT: 5000
      NODE_ENV: production
      JWT_SECRET: "docker-compose-production-jwt-secret-key-civicresolve"
      AI_PROVIDER: fallback
      AI_CONFIDENCE_THRESHOLD: 0.75
      UPLOAD_DIR: "/app/uploads"
    ports:
      - "5000:5000"
    depends_on:
      - postgres
    volumes:
      - uploads_data:/app/uploads

volumes:
  postgres_data:
  uploads_data:
